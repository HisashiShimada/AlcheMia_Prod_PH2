   server {
       listen       80;
       listen       443 ssl http2 default_server;
       listen       [::]:443 ssl http2 default_server;
       server_name  web.local.example-dev.com;
       root         /usr/share/nginx/html;

       ssl_certificate "/etc/nginx/server_certificates/server.crt";
       ssl_certificate_key "/etc/nginx/server_certificates/server.key";
       # It is *strongly* recommended to generate unique DH parameters
       # Generate them with: openssl dhparam -out /etc/pki/nginx/dhparams.pem 2048
       #ssl_dhparam "/etc/pki/nginx/dhparams.pem";
       ssl_session_cache shared:SSL:1m;
       ssl_session_timeout  10m;
       ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
       ssl_ciphers HIGH:SEED:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!RSAPSK:!aDH:!aECDH:!EDH-DSS-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA:!SRP;
       ssl_prefer_server_ciphers on;

       ssl_client_certificate "/etc/nginx/client_certificates/ca.crt";
       ssl_verify_client on;

       # Load configuration files for the default server block.
       include /etc/nginx/default.d/*.conf;
       
       # クライアント証明書のSubject DNを取得
       set $client_dn $ssl_client_s_dn;

       # CN抽出（例：CN=tenant1）
       if ($client_dn ~ "CN=([a-zA-Z0-9._%+-]+),") {
           set $tenant_id $1;
       }

       location / {
           ### リクエストヘッダに$hostをセット
           # $host: Hostリクエストヘッダがあればそのサーバ名、なければプライマリサーバ名(server_name)
           proxy_set_header Host $host;

           # クエリパラメータを付与してリダイレクト
           #rewrite ^/(.*)$ /$1?org=$tenant_id break;
           
           proxy_set_header X-Tenant-Id $tenant_id;
           proxy_set_header X-Client-CN $client_dn;  # 必要ならCN全体も渡す


           ### ローカル環境（host.docker.internal）の3000番ポートへプロキシする
           proxy_pass http://localhost:3000;
       }

       error_page 404 /404.html;
           location = /40x.html {
       }

       error_page 500 502 503 504 /50x.html;
           location = /50x.html {
       }
   }
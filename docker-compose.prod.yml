# mmdpf Docker Compose Configuration - 本番環境用
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mmdpf-postgres
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-mmdpf_db}
      POSTGRES_USER: ${DB_USER:-mmdpf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # 本番環境では環境変数で設定
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mmdpf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-mmdpf_user} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenStack Swift (Object Storage)
  swift:
    image: bouncestorage/swift-aio:latest
    container_name: mmdpf-swift
    env_file:
      - .env.production
    ports:
      - "8080:8080"
    environment:
      AUTH_URL: ${SWIFT_AUTH_URL}
      ACCOUNT: ${SWIFT_ACCOUNT}
      USER: ${SWIFT_USER}
      PASSWORD: ${SWIFT_PASSWORD}
    volumes:
      - swift-data:/srv
    networks:
      - mmdpf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/auth/v1.0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmdpf-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      swift:
        condition: service_healthy
    networks:
      - mmdpf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmdpf-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1  # 本番ドメインに変更
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mmdpf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (本番環境: HTTPS + クライアント証明書認証)
  nginx:
    image: nginx:alpine
    container_name: mmdpf-nginx
    ports:
      - "80:80"      # HTTP (HTTPSへリダイレクト)
      - "443:443"    # HTTPS (クライアント証明書認証)
    volumes:
      # 本番環境用Nginx設定ファイル（HTTPS + クライアント証明書認証）
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      # 証明書ファイル（本番環境では必須）
      - ./certs/ca/ca.crt:/etc/nginx/certs/ca/ca.crt:ro
      - ./certs/server/server.crt:/etc/nginx/certs/server/server.crt:ro
      - ./certs/server/server.key:/etc/nginx/certs/server/server.key:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mmdpf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
    name: mmdpf_postgres-data
  swift-data:
    name: mmdpf_swift-data

networks:
  mmdpf-network:
    name: mmdpf-network
    driver: bridge

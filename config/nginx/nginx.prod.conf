# MMDPF Nginx設定 - 本番環境用（HTTPS + クライアント証明書認証）

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ログ設定
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ##
    # Client Certificate Organization ID Extraction
    # クライアント証明書からCN（組織ID）を抽出
    ##
    # 証明書のSubject DNからCN（UUID形式）を抽出してorganization_id変数に格納
    # 正規表現: CN=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx の形式のみマッチ
    map $ssl_client_s_dn $organization_id {
        default "";
        "~CN=(?<CN>[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})" $CN;
    }

    # クエリ文字列が存在する場合の区切り文字（& or 空文字）
    map $args $arg_sep {
        ""      "";
        default "&";
    }

    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Phase1-2: ファイルサイズ上限を500MBに引き上げ（2026-02-18）
    client_max_body_size 500M;      # 最大リクエストボディサイズ（Reference版に合わせて引き上げ）
    client_body_timeout 300s;       # クライアントボディ送信タイムアウト

    # Gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # ECS Fargate の DNS リゾルバー（動的 DNS 解決のために必須）
    # Service Discovery のホスト名 (alchemia-backend.alchemia.local) を動的解決する
    resolver 169.254.169.253 valid=10s;
    resolver_timeout 5s;

    # HTTPSサーバー（本番環境用）
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        ##
        # SSL設定
        ##
        # サーバー証明書と秘密鍵のパスを環境に合わせて設定してください
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # SSL/TLSプロトコル設定
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # SSL Session設定
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        ##
        # クライアント証明書検証設定
        ##
        # CA証明書のパスを環境に合わせて設定してください
        ssl_client_certificate /etc/nginx/ssl/ca.crt;
        
        # クライアント証明書の検証レベル
        # optional: 証明書なしでもアクセス可（移行期推奨）
        # on: 証明書必須（本番運用時推奨）
        ssl_verify_client optional;
        
        # 証明書チェーンの検証深度
        ssl_verify_depth 2;

        ##
        # セキュリティヘッダー
        ##
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        ##
        # クライアント証明書検証失敗時のエラーハンドリング
        ##
        # 証明書検証が失敗した場合は403エラーを返す
        # （optional設定の場合、証明書なしのアクセスは許可される）
        if ($ssl_client_verify = "FAILED") {
            return 403;
        }

        # バックエンドAPI
        location /api/ {
            # organization_idが空の場合は元のargsをそのまま使用
            set $new_args $args;
            if ($organization_id != "") {
                set $new_args "${args}${arg_sep}orgId=${organization_id}";
            }

            # 変数でproxy_pass → resolverによる動的DNS解決が有効になる
            set $backend_upstream "BACKEND_HOST_PLACEHOLDER:BACKEND_PORT_PLACEHOLDER";
            proxy_pass http://$backend_upstream$uri?$new_args;

            # クライアント証明書情報をヘッダーで送信
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-CN $organization_id;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Organization-Id $organization_id;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # フロントエンド
        location / {
            set $new_args $args;
            if ($organization_id != "") {
                set $new_args "${args}${arg_sep}orgId=${organization_id}";
            }

            # 変数でproxy_pass → resolverによる動的DNS解決が有効になる
            set $frontend_upstream "FRONTEND_HOST_PLACEHOLDER:FRONTEND_PORT_PLACEHOLDER";
            proxy_pass http://$frontend_upstream$uri?$new_args;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # エラーページ
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"success":false,"error":{"code":"CERT_VERIFICATION_FAILED","message":"Client certificate verification failed"}}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    ##
    # HTTP サーバー（ALB + HTTP:80 構成用）
    # ALB が HTTP:80 のみの場合、ここで /api/ と / を直接プロキシする
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # ECS ヘルスチェック用エンドポイント
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # バックエンドAPI
        location /api/ {
            set $new_args $args;
            if ($organization_id != "") {
                set $new_args "${args}${arg_sep}orgId=${organization_id}";
            }

            # 変数でproxy_pass → resolverによる動的DNS解決が有効になる
            set $backend_upstream "BACKEND_HOST_PLACEHOLDER:BACKEND_PORT_PLACEHOLDER";
            proxy_pass http://$backend_upstream$uri?$new_args;

            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-CN $organization_id;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Organization-Id $organization_id;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # フロントエンド
        location / {
            set $new_args $args;
            if ($organization_id != "") {
                set $new_args "${args}${arg_sep}orgId=${organization_id}";
            }

            # 変数でproxy_pass → resolverによる動的DNS解決が有効になる
            set $frontend_upstream "FRONTEND_HOST_PLACEHOLDER:FRONTEND_PORT_PLACEHOLDER";
            proxy_pass http://$frontend_upstream$uri?$new_args;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

# MMDPF Nginx設定 - 本番環境用（HTTPS + クライアント証明書認証）

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ログ設定
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ##
    # Client Certificate Organization ID Extraction
    # クライアント証明書からCN（組織ID）を抽出
    ##
    # 証明書のSubject DNからCN（UUID形式）を抽出してorganization_id変数に格納
    # 正規表現: CN=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx の形式のみマッチ
    map $ssl_client_s_dn $organization_id {
        default "";
        ~CN=(?<CN>[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}) $CN;
    }

    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Phase1-2: ファイルサイズ上限を500MBに引き上げ（2026-02-18）
    client_max_body_size 500M;      # 最大リクエストボディサイズ（Reference版に合わせて引き上げ）
    client_body_timeout 300s;       # クライアントボディ送信タイムアウト

    # Gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # アップストリーム定義
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    # HTTPSサーバー（本番環境用）
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        ##
        # SSL設定
        ##
        # サーバー証明書と秘密鍵のパスを環境に合わせて設定してください
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # SSL/TLSプロトコル設定
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # SSL Session設定
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        ##
        # クライアント証明書検証設定
        ##
        # CA証明書のパスを環境に合わせて設定してください
        ssl_client_certificate /etc/nginx/ssl/ca.crt;
        
        # クライアント証明書の検証レベル
        # optional: 証明書なしでもアクセス可（移行期推奨）
        # on: 証明書必須（本番運用時推奨）
        ssl_verify_client optional;
        
        # 証明書チェーンの検証深度
        ssl_verify_depth 2;

        ##
        # セキュリティヘッダー
        ##
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;

        ##
        # クライアント証明書検証失敗時のエラーハンドリング
        ##
        # 証明書検証が失敗した場合は403エラーを返す
        # （optional設定の場合、証明書なしのアクセスは許可される）
        if ($ssl_client_verify = "FAILED") {
            return 403;
        }

        # バックエンドAPI
        location /api/ {
            # 既存のクエリパラメータを保持しつつ、orgIdを追加
            set $new_args $args;
            
            # 組織IDが取得できている場合のみクエリパラメータを追加
            if ($organization_id != "") {
                set $new_args "$args&orgId=$organization_id";
                
                # argsが空の場合は先頭に&をつけない
                if ($args = "") {
                    set $new_args "orgId=$organization_id";
                }
            }
            
            # バックエンドサーバーにプロキシ（クエリパラメータ付き）
            proxy_pass http://backend$uri?$new_args;

            # クライアント証明書情報をヘッダーで送信
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-CN $organization_id;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Organization-Id $organization_id;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Phase1-2: タイムアウト設定を300sに延長（大容量ファイル対応）
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket対応
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # フロントエンド
        location / {
            # 既存のクエリパラメータを保持しつつ、orgIdを追加
            set $new_args $args;
            
            # 組織IDが取得できている場合のみクエリパラメータを追加
            if ($organization_id != "") {
                set $new_args "$args&orgId=$organization_id";
                
                # argsが空の場合は先頭に&をつけない
                if ($args = "") {
                    set $new_args "orgId=$organization_id";
                }
            }
            
            # フロントエンドサーバーにプロキシ（クエリパラメータ付き）
            proxy_pass http://frontend$uri?$new_args;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js Hot Reload対応
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # エラーページ
        error_page 403 /403.html;
        location = /403.html {
            internal;
            return 403 '{"success":false,"error":{"code":"CERT_VERIFICATION_FAILED","message":"Client certificate verification failed"}}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    ##
    # HTTPからHTTPSへのリダイレクト
    ##
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;
        
        # HTTPSへリダイレクト
        return 301 https://$server_name$request_uri;
    }
}

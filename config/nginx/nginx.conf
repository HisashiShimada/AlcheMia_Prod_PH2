# MMDPF Nginx設定 - クライアント証明書認証対応

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ログ設定
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cert_cn="$ssl_client_s_dn_cn" cert_verify="$ssl_client_verify"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # アップストリーム定義
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    # HTTPからHTTPSへのリダイレクト
    server {
        listen 80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS + クライアント証明書認証
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        # SSL/TLS設定
        include /etc/nginx/conf.d/ssl.conf;

        # クライアント証明書検証（必須）
        ssl_client_certificate /etc/nginx/certs/ca/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        # クライアント証明書のSubject DNを取得
        set $client_dn $ssl_client_s_dn;
        set $client_cn $ssl_client_s_dn_cn;
        set $org_id "";

        # CNから組織IDを抽出
        # 形式: CN={uuid}
        if ($client_cn ~ "^\{([a-f0-9\-]+)\}$") {
            set $org_id $1;
        }

        # バックエンドAPI
        location /api/ {
            proxy_pass http://backend;

            # 証明書情報をヘッダーで渡す
            proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
            proxy_set_header X-Organization-Id $org_id;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # タイムアウト設定
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket対応
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # フロントエンド
        location / {
            proxy_pass http://frontend;

            # 標準ヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js Hot Reload対応
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 証明書エラー時のカスタムエラーページ
        error_page 495 496 497 @cert_error;
        location @cert_error {
            default_type application/json;
            return 403 '{"success": false, "error": {"code": "CERT_REQUIRED", "message": "Valid client certificate is required"}}';
        }

        # 一般エラーページ
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
